name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ml/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'ml/**'

jobs:
  checks:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Adjust this to match your target version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Installing linting and testing tools
          pip install "black[jupyter]" flake8 mypy pytest httpx

      - name: Check code formatting with Black
        run: black --check backend ml

      - name: Lint with flake8
        run: flake8 backend ml --count --select=E9,F63,F7,F82 --show-source --statistics
        
      - name: Run mypy (type checking)
        # mypy might fail initially if code isn't fully typed, adjust strictly as needed
        run: mypy backend ml --ignore-missing-imports

      - name: Run tests with pytest
        run: pytest backend

  deploy:
    name: Deploy to Render
    needs: checks
    # Only run deployment when pushing to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Production Backend

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set!"
            exit 1
          fi
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deployment triggered successfully on Render."
