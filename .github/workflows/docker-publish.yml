name: Publish Docker Images

# This workflow runs whenever a new Release is published on GitHub
on:
  release:
    types: [published]

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            naveenboddepalli/resume-analyser-backend
            naveenboddepalli/resume-analyser-frontend
          tags: |
            # Tag with the release version (e.g., v1.0.0)
            type=semver,pattern={{version}}
            # Always tag as latest
            type=raw,value=latest

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            naveenboddepalli/resume-analyser-backend:${{ github.event.release.tag_name }}
            naveenboddepalli/resume-analyser-backend:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            naveenboddepalli/resume-analyser-frontend:${{ github.event.release.tag_name }}
            naveenboddepalli/resume-analyser-frontend:latest
          labels: ${{ steps.meta.outputs.labels }}
